type: object
required:
  - _id
  - name
  - age
  - gender
  - avgMark
  - onDuty
properties:
  _id:
    description: "ID студента"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Имя студента"
    type: string
    example: 'John Doe'
  age:
    description: "Возраст студента"
    type: number
    example: 12
  gender:
    description: "Пол студента"
    type: string
    enum: ['male', 'female', 'other']
  avgMark:
    description: "Средняя оценка студента (от 1 до 12)"
    type: number
    example: 9.7
  onDuty:
    description: 'Дежурный ли студент'
    type: boolean
    example: false
  parentId:
    description: "ID родителя студента"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Ссылка на фото студента"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
